<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotó galéria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #f5f0eb;
    --card: #ffffff;
    --accent: #2c5f4a;
    --accent2: #e8a838;
    --text: #1a1a1a;
    --muted: #888;
    --border: #e0d8d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    /* Letöltésvédelem */
    -webkit-user-select: none;
    user-select: none;
  }

  /* Jobb klikk és drag tiltás */
  img { pointer-events: none; -webkit-user-drag: none; }

  header {
    background: var(--accent);
    color: white;
    padding: 1.2rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
  }
  header span { font-size: 0.85rem; opacity: 0.8; }

  .kosar-btn {
    background: var(--accent2);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: transform 0.1s;
  }
  .kosar-btn:active { transform: scale(0.96); }
  .kosar-szam {
    background: white;
    color: var(--accent2);
    border-radius: 50%;
    width: 1.4rem; height: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700;
  }

  /* Csomag sáv - csak rendelős módban */
  #csomag-sav {
    background: white;
    border-bottom: 2px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 0.9rem;
  }
  #csomag-sav.aktiv { display: flex; }
  .csomag-progress {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .progress-bar {
    width: 150px;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s;
  }
  .csomag-info { color: var(--muted); font-size: 0.82rem; }
  .csomag-info strong { color: var(--accent); }

  /* Loading */
  #loading {
    text-align: center;
    padding: 4rem 1.5rem;
    color: var(--muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Hiba */
  #hiba {
    display: none;
    text-align: center;
    padding: 4rem 1.5rem;
  }
  #hiba .ikon { font-size: 3rem; margin-bottom: 1rem; }
  #hiba p { color: var(--muted); }

  /* Zárt album */
  #zart {
    display: none;
    text-align: center;
    padding: 4rem 1.5rem;
  }
  #zart .ikon { font-size: 3rem; margin-bottom: 1rem; }

  /* Galéria */
  #galeria {
    padding: 1rem;
    max-width: 1000px;
    margin: 0 auto;
    display: none;
  }
  .galeria-info {
    text-align: center;
    padding: 1rem 0 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .galeria-info strong { color: var(--accent); font-size: 1.1rem; }

  .kepek-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .kep-kartya {
    background: var(--card);
    border-radius: 0.75rem;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: box-shadow 0.2s, transform 0.2s;
    border: 2px solid transparent;
  }
  .kep-kartya.aktiv {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(44,95,74,0.2);
  }
  .kep-wrapper {
    position: relative;
    aspect-ratio: 1/1;
    overflow: hidden;
    background: #eee;
    cursor: pointer;
  }
  .kep-wrapper img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .kep-wrapper:hover img { transform: scale(1.03); }
  .kep-sorszam {
    position: absolute;
    bottom: 0.5rem; left: 0.5rem;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 0.75rem;
    padding: 0.2rem 0.5rem;
    border-radius: 0.3rem;
    font-weight: 500;
  }
  .kep-pipa {
    position: absolute;
    top: 0.5rem; right: 0.5rem;
    background: var(--accent);
    color: white;
    width: 2rem; height: 2rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .kep-kartya.aktiv .kep-pipa { opacity: 1; }
  .kep-zoom {
    position: absolute;
    bottom: 0.5rem; right: 0.5rem;
    background: rgba(0,0,0,0.5);
    color: white;
    width: 2rem; height: 2rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .kep-zoom:hover { background: rgba(0,0,0,0.8); }

  /* Rendelési panel */
  .rendeles-panel {
    padding: 0.75rem;
    display: none;
    flex-direction: column;
    gap: 0.4rem;
  }
  .kep-kartya.aktiv .rendeles-panel { display: flex; }

  .meret-sor {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.3rem 0;
    border-bottom: 1px solid var(--border);
    gap: 0.3rem;
  }
  .meret-sor:last-child { border-bottom: none; }
  .meret-nev {
    font-size: 0.82rem;
    color: var(--text);
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }
  .meret-ar {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    margin-right: 0.5rem;
  }
  .szamlalo {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .szamlalo button {
    width: 1.8rem; height: 1.8rem;
    border: 2px solid var(--border);
    background: white;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    color: var(--text);
    flex-shrink: 0;
  }
  .szamlalo button:hover { border-color: var(--accent); color: var(--accent); }
  .szamlalo span {
    min-width: 1.5rem;
    text-align: center;
    font-weight: 600;
    font-size: 0.95rem;
  }

  /* Válogató gomb */
  .valogato-gomb {
    width: 100%;
    padding: 0.6rem;
    margin: 0.5rem 0;
    background: white;
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text);
  }
  .kep-kartya.aktiv .valogato-gomb {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .valogato-gomb:hover { border-color: var(--accent); }

  /* Fullscreen */
  #fullscreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #fullscreen.aktiv { display: flex; }
  #fullscreen img {
    max-width: 95vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 0.5rem;
    pointer-events: none;
  }
  #fullscreen-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 2.5rem; height: 2.5rem;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #fullscreen-info { color: rgba(255,255,255,0.7); margin-top: 0.75rem; font-size: 0.85rem; }

  /* Modal */
  #modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  #modal-bg.aktiv { display: flex; }
  #modal {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 1.5rem 1.5rem 0 0;
    padding: 1.5rem;
    max-height: 85vh;
    overflow-y: auto;
  }
  #modal h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 1rem; color: var(--accent); }
  .nev-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    margin-bottom: 1rem;
    outline: none;
  }
  .nev-input:focus { border-color: var(--accent); }
  .ossz-sor {
    display: flex;
    justify-content: space-between;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .ossz-kepszam { color: var(--muted); font-size: 0.8rem; }
  .ossz-total {
    display: flex;
    justify-content: space-between;
    padding: 0.75rem 0;
    font-weight: 700;
    font-size: 1.1rem;
    border-top: 2px solid var(--text);
    margin-top: 0.5rem;
  }
  .kuldes-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 1rem;
    border-radius: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  .kuldes-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-close {
    width: 100%;
    background: none;
    border: 2px solid var(--border);
    padding: 0.75rem;
    border-radius: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 0.5rem;
    color: var(--muted);
  }

  /* Siker */
  #siker { display: none; text-align: center; padding: 4rem 1.5rem; }
  #siker.aktiv { display: block; }
  #siker .ikon { font-size: 4rem; margin-bottom: 1rem; }
  #siker h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 0.75rem; }
  #siker p { color: var(--muted); line-height: 1.6; }

  @media (max-width: 480px) {
    .kepek-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .meret-ar { display: none; }
    header h1 { font-size: 1rem; }
    .progress-bar { width: 100px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="album-cim">📸 Fotó galéria</h1>
  <button class="kosar-btn" onclick="kosarMegnyit()" id="kosar-gomb" style="display:none">
    🛒 <span id="kosar-szam">0</span>
  </button>
</header>

<!-- Csomag sáv -->
<div id="csomag-sav">
  <div class="csomag-progress">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="csomag-info" id="csomag-info">0 / 0 kép kiválasztva</span>
  </div>
  <span id="csomag-ar" style="font-weight:600;color:var(--accent)"></span>
</div>

<div id="loading"><div class="spinner"></div><p>Betöltés...</p></div>
<div id="zart"><div class="ikon">🔒</div><h2>Ez az album jelenleg nem elérhető.</h2></div>
<div id="hiba"><div class="ikon">😕</div><p id="hiba-szoveg">Ismeretlen hiba.</p></div>
<div id="galeria">
  <div class="galeria-info"><strong id="kep-szam">0</strong> kép — kattints a képre a kiválasztáshoz</div>
  <div class="kepek-grid" id="kepek-grid"></div>
</div>
<div id="siker"><div class="ikon">🎉</div><h2>Köszönjük!</h2><p>Hamarosan felvesszük Önnel a kapcsolatot.</p></div>

<!-- Fullscreen -->
<div id="fullscreen">
  <button id="fullscreen-close" onclick="fullscreenBezar()">✕</button>
  <img id="fullscreen-img" src="" alt="">
  <div id="fullscreen-info"></div>
</div>

<!-- Modal -->
<div id="modal-bg">
  <div id="modal">
    <h2 id="modal-cim">🛒 Összesítő</h2>
    <input class="nev-input" id="rendelo-nev" placeholder="Az Ön neve *" type="text">
    <input class="nev-input" id="rendelo-email" placeholder="Email cím *" type="email">
    <div id="ossz-lista"></div>
    <div class="ossz-total"><span>Összesen:</span><span id="ossz-ar">0 Ft</span></div>
    <button class="kuldes-btn" id="kuldes-btn" onclick="rendeleKuld()">Elküldés</button>
    <button class="modal-close" onclick="kosarBezar()">← Vissza</button>
  </div>
</div>

<script>
// ============================================================
// KONFIGURÁCIÓ
// ============================================================
const CONFIG = {
  sheetsId:   '1lmGSh1nwJ1qYYAhG0jIu6zM3jIqoIN1_hKxtex9dSnw',
  apiKey:     'AIzaSyDo6db2TBZeQAVdWJ5GDQ1tAjbxUahuH6s',
};

const MERETEK = [
  { id: '7x9',        nev: '7×9 cm',    ar: 800,  megjegyzes: '2 db / adag', egyseg: 'adag' },
  { id: '10x15',      nev: '10×15 cm',  ar: 600,  megjegyzes: '',            egyseg: 'db' },
  { id: '13x18',      nev: '13×18 cm',  ar: 750,  megjegyzes: '',            egyseg: 'db' },
  { id: '20x30',      nev: '20×30 cm',  ar: 950,  megjegyzes: '',            egyseg: 'db' },
  { id: 'igazolvany', nev: 'Ig.kép',    ar: 600,  megjegyzes: '6 db / adag', egyseg: 'adag' },
];

// ============================================================
// ÁLLAPOT
// ============================================================
let albumConfig = null;
let kepek = [];
let kivalasztott = {}; // { fileId: true } - válogató módban
let rendeles = {};     // { fileId: { '10x15': 2, ... } } - rendelős módban
let apiKey = CONFIG.apiKey;
let webhookUrl = '';

// ============================================================
// INDULÁS
// ============================================================
window.addEventListener('load', init);
document.addEventListener('contextmenu', e => e.preventDefault()); // jobb klikk tiltás

async function init() {
  const params = new URLSearchParams(window.location.search);
  const albumId = params.get('album');

  if (!albumId) {
    mutat('hiba');
    document.getElementById('hiba-szoveg').textContent = 'Nincs album megadva. Kérjük használja a kapott linket.';
    return;
  }

  try {
    // Sheets beolvasás
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetsId}/values/Album%20kezel%C5%91!A2:L100?key=${CONFIG.apiKey}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Sheets API hiba: ' + resp.status);
    const data = await resp.json();
    const rows = data.values || [];

    // Album megkeresése
    const row = rows.find(r => r[0] === albumId);
    if (!row) {
      mutat('hiba');
      document.getElementById('hiba-szoveg').textContent = 'Az album nem található.';
      return;
    }

    albumConfig = {
      id:         row[0] || '',
      nev:        row[1] || '',
      tipus:      row[2] || 'rendelő',
      allapot:    row[3] || '🔴 zárt',
      folderId:   row[4] || '',
      csomagDb:   parseInt(row[5]) || 0,
      egysegAr:   parseInt(row[6]) || 0,
      webhookUrl: row[10] || '',
      engedélyezettMeretek: row[11] ? row[11].split(',').map(s => s.trim()) : [],
    };

    webhookUrl = albumConfig.webhookUrl;

    // Zárt album
    if (!albumConfig.allapot.includes('nyilvános')) {
      mutat('zart');
      return;
    }

    // Drive mappa ID ellenőrzés
    if (!albumConfig.folderId) {
      mutat('hiba');
      document.getElementById('hiba-szoveg').textContent = 'Nincs Drive mappa beállítva ehhez az albumhoz.';
      return;
    }

    // Fejléc és mód beállítás
    document.getElementById('album-cim').textContent = '📸 ' + (albumConfig.nev || albumId);
    document.title = albumConfig.nev || albumId;

    if (albumConfig.tipus === 'válogató') {
      document.getElementById('kosar-gomb').style.display = 'flex';
      document.getElementById('kosar-gomb').innerHTML = '✅ Kiválasztottak <span class="kosar-szam" id="kosar-szam">0</span>';
      document.getElementById('modal-cim').textContent = '✅ Kiválasztott képek';
    } else {
      document.getElementById('kosar-gomb').style.display = 'flex';
      if (albumConfig.csomagDb > 0) {
        document.getElementById('csomag-sav').classList.add('aktiv');
        csomagFrissit();
      }
    }

    // Képek betöltése
    await kepekBetolt();

  } catch(e) {
    mutat('hiba');
    document.getElementById('hiba-szoveg').textContent = 'Hiba: ' + e.message;
  }
}

async function kepekBetolt() {
  mutat('loading');
  try {
    let allFiles = [];
    let pageToken = '';
    do {
      const url = `https://www.googleapis.com/drive/v3/files?q='${albumConfig.folderId}'+in+parents+and+mimeType+contains+'image/'&fields=nextPageToken,files(id,name)&orderBy=name&pageSize=100&key=${apiKey}${pageToken ? '&pageToken='+pageToken : ''}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Drive API hiba');
      const data = await resp.json();
      allFiles = allFiles.concat(data.files || []);
      pageToken = data.nextPageToken || '';
    } while (pageToken);

    kepek = allFiles;
    mutat('galeria');
    galeriaMegjelenít();
  } catch(e) {
    mutat('hiba');
    document.getElementById('hiba-szoveg').textContent = 'Képek betöltési hiba: ' + e.message;
  }
}

// ============================================================
// GALÉRIA
// ============================================================
function galeriaMegjelenít() {
  document.getElementById('kep-szam').textContent = kepek.length;
  const grid = document.getElementById('kepek-grid');
  grid.innerHTML = '';

  const isValogato = albumConfig.tipus === 'válogató';
  const isMindketto = albumConfig.tipus === 'mindkettő';

  kepek.forEach(kep => {
    const thumbUrl = `https://drive.google.com/thumbnail?id=${kep.id}&sz=w400`;
    const fullUrl  = `https://drive.google.com/thumbnail?id=${kep.id}&sz=w1200`;
    const sorszam  = kep.name.replace(/\.[^.]+$/, '');

    const kartya = document.createElement('div');
    kartya.className = 'kep-kartya';
    kartya.id = 'kep-' + kep.id;

    let panelHtml = '';

    if (isValogato || isMindketto) {
      panelHtml += `<button class="valogato-gomb" onclick="valogatoToggle('${kep.id}')">
        ${kivalasztott[kep.id] ? '✅ Kiválasztva' : '☐ Ezt szeretném retusálva'}
      </button>`;
    }

    if (!isValogato) {
      const aktívMeretek = albumConfig.engedélyezettMeretek.length > 0
        ? MERETEK.filter(m => albumConfig.engedélyezettMeretek.includes(m.id))
        : MERETEK;
      panelHtml += aktívMeretek.map(m => `
        <div class="meret-sor">
          <span class="meret-nev">${m.nev}${m.megjegyzes ? '<br><small style="color:#aaa;font-weight:400">'+m.megjegyzes+'</small>' : ''}</span>
          <span class="meret-ar">${m.ar} Ft/${m.egyseg}</span>
          <div class="szamlalo">
            <button onclick="szamlaloCsokkent('${kep.id}','${m.id}')">−</button>
            <span id="db-${kep.id}-${m.id}">0</span>
            <button onclick="szamlaloNovelt('${kep.id}','${m.id}')">+</button>
          </div>
        </div>
      `).join('');
    }

    kartya.innerHTML = `
      <div class="kep-wrapper" onclick="kepKattint('${kep.id}', event)">
        <img src="${thumbUrl}" alt="${sorszam}" loading="lazy" draggable="false">
        <div class="kep-sorszam">${sorszam}</div>
        <div class="kep-pipa">✓</div>
        <div class="kep-zoom" onclick="event.stopPropagation(); fullscreenMegnyit('${fullUrl}', '${sorszam}')">🔍</div>
      </div>
      <div class="rendeles-panel">${panelHtml}</div>
    `;

    // Dupla kattintás = fullscreen (asztali gépen)
    kartya.querySelector('img').addEventListener('dblclick', e => {
      e.stopPropagation();
      fullscreenMegnyit(fullUrl, sorszam);
    });

    grid.appendChild(kartya);
  });
}

// ============================================================
// INTERAKCIÓK
// ============================================================
function kepKattint(id) {
  const kartya = document.getElementById('kep-' + id);
  kartya.classList.toggle('aktiv');
  kosarFrissit();
}

function valogatoToggle(id) {
  kivalasztott[id] = !kivalasztott[id];
  const kartya = document.getElementById('kep-' + id);
  const gomb = kartya.querySelector('.valogato-gomb');
  if (kivalasztott[id]) {
    gomb.textContent = '✅ Kiválasztva';
    kartya.classList.add('aktiv');
  } else {
    gomb.textContent = '☐ Ezt szeretném retusálva';
    kartya.classList.remove('aktiv');
  }
  kosarFrissit();
}

function szamlaloNovelt(kepId, meretId) {
  if (!rendeles[kepId]) rendeles[kepId] = {};
  rendeles[kepId][meretId] = (rendeles[kepId][meretId] || 0) + 1;
  document.getElementById(`db-${kepId}-${meretId}`).textContent = rendeles[kepId][meretId];
  document.getElementById('kep-' + kepId).classList.add('aktiv');
  kosarFrissit();
  csomagFrissit();
}

function szamlaloCsokkent(kepId, meretId) {
  if (!rendeles[kepId]) return;
  const cur = rendeles[kepId][meretId] || 0;
  if (cur <= 0) return;
  rendeles[kepId][meretId] = cur - 1;
  document.getElementById(`db-${kepId}-${meretId}`).textContent = rendeles[kepId][meretId];
  kosarFrissit();
  csomagFrissit();
}

function kosarFrissit() {
  let db = 0;
  if (albumConfig.tipus === 'válogató') {
    db = Object.values(kivalasztott).filter(v => v).length;
  } else {
    Object.values(rendeles).forEach(r => {
      Object.values(r).forEach(v => { if (v > 0) db++; });
    });
  }
  document.getElementById('kosar-szam').textContent = db;
}

function csomagFrissit() {
  if (!albumConfig.csomagDb) return;
  let osszDb = 0;
  let osszAr = 0;
  const aktívMeretek = albumConfig.engedélyezettMeretek.length > 0
    ? MERETEK.filter(m => albumConfig.engedélyezettMeretek.includes(m.id))
    : MERETEK;
  kepek.forEach(kep => {
    const r = rendeles[kep.id];
    if (!r) return;
    aktívMeretek.forEach(m => {
      const db = r[m.id] || 0;
      osszDb += db;
      osszAr += db * m.ar;
    });
  });
  const pct = Math.min(100, Math.round(osszDb / albumConfig.csomagDb * 100));
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('csomag-info').innerHTML = `<strong>${osszDb}</strong> / ${albumConfig.csomagDb} kép kiválasztva`;
  if (albumConfig.egysegAr && osszDb > albumConfig.csomagDb) {
    const plusz = osszDb - albumConfig.csomagDb;
    document.getElementById('csomag-ar').textContent = `+${plusz} plusz kép: ${(plusz * albumConfig.egysegAr).toLocaleString('hu-HU')} Ft`;
  } else {
    document.getElementById('csomag-ar').textContent = '';
  }
}

// ============================================================
// FULLSCREEN
// ============================================================
function fullscreenMegnyit(url, sorszam) {
  document.getElementById('fullscreen-img').src = url;
  document.getElementById('fullscreen-info').textContent = sorszam;
  document.getElementById('fullscreen').classList.add('aktiv');
}
function fullscreenBezar() {
  document.getElementById('fullscreen').classList.remove('aktiv');
}

// ============================================================
// KOSÁR / KÜLDÉS
// ============================================================
function kosarMegnyit() {
  const lista = document.getElementById('ossz-lista');
  lista.innerHTML = '';
  let osszAr = 0;
  let vanAdat = false;

  if (albumConfig.tipus === 'válogató') {
    const kivalasztottKepek = kepek.filter(k => kivalasztott[k.id]);
    kivalasztottKepek.forEach(kep => {
      vanAdat = true;
      const sor = document.createElement('div');
      sor.className = 'ossz-sor';
      sor.innerHTML = `<div>${kep.name.replace(/\.[^.]+$/, '')}</div><div>retusálásra</div>`;
      lista.appendChild(sor);
    });
  } else {
    kepek.forEach(kep => {
      const r = rendeles[kep.id];
      if (!r) return;
      const sorszam = kep.name.replace(/\.[^.]+$/, '');
      MERETEK.forEach(m => {
        const db = r[m.id] || 0;
        if (db <= 0) return;
        vanAdat = true;
        const ar = db * m.ar;
        osszAr += ar;
        const sor = document.createElement('div');
        sor.className = 'ossz-sor';
        sor.innerHTML = `<div>${sorszam} — ${m.nev}<div class="ossz-kepszam">${db} ${m.egyseg}</div></div><div>${ar.toLocaleString('hu-HU')} Ft</div>`;
        lista.appendChild(sor);
      });
    });
  }

  if (!vanAdat) {
    lista.innerHTML = '<div style="color:#aaa;text-align:center;padding:1rem">Még nem választottál ki semmit.</div>';
  }

  document.getElementById('ossz-ar').textContent = albumConfig.tipus === 'válogató' ? '' : osszAr.toLocaleString('hu-HU') + ' Ft';
  document.getElementById('kuldes-btn').disabled = !vanAdat;
  document.getElementById('modal-bg').classList.add('aktiv');
}

function kosarBezar() {
  document.getElementById('modal-bg').classList.remove('aktiv');
}

async function rendeleKuld() {
  const nev = document.getElementById('rendelo-nev').value.trim();
  const email = document.getElementById('rendelo-email').value.trim();
  if (!nev) {
    alert('Kérjük add meg a nevedet!');
    document.getElementById('rendelo-nev').focus();
    return;
  }
  if (!email || !email.includes('@')) {
    alert('Kérjük add meg az email címedet!');
    document.getElementById('rendelo-email').focus();
    return;
  }

  let adatok;
  if (albumConfig.tipus === 'válogató') {
    adatok = kepek
      .filter(k => kivalasztott[k.id])
      .map(k => ({ 'Kép sorszáma': k.name.replace(/\.[^.]+$/, ''), 'Típus': 'retusálásra' }));
  } else {
    adatok = [];
    kepek.forEach(kep => {
      const r = rendeles[kep.id];
      if (!r) return;
      const sorszam = kep.name.replace(/\.[^.]+$/, '');
      let vanAdat = false;
      MERETEK.forEach(m => { if ((r[m.id] || 0) > 0) vanAdat = true; });
      if (!vanAdat) return;
      adatok.push({
        'Kép sorszáma': sorszam,
        '7*9 cm': r['7x9'] || 0,
        '10*15 cm': r['10x15'] || 0,
        '13*18 cm': r['13x18'] || 0,
        '20*30 cm': r['20x30'] || 0,
        'igazolványkép': r['igazolvany'] || 0,
      });
    });
  }

  const btn = document.getElementById('kuldes-btn');
  btn.disabled = true;
  btn.textContent = 'Küldés...';

  try {
    if (webhookUrl) {
      const params = new URLSearchParams({
        nev, email, album: albumConfig.id,
        adatok: JSON.stringify(adatok),
        idopont: new Date().toISOString()
      });
      fetch(webhookUrl + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
      // no-cors nem ad vissza választ, ezért nem várunk rá
    }
  } catch(e) {
    // csendben kezeljük
  }
  // Mindig megjelenítjük a siker képernyőt
  document.getElementById('modal-bg').classList.remove('aktiv');
  document.getElementById('csomag-sav').classList.remove('aktiv');
  mutat('siker');
}

// ============================================================
// SEGÉDFÜGGVÉNYEK
// ============================================================
function mutat(id) {
  ['loading','galeria','hiba','zart','siker'].forEach(s => {
    const el = document.getElementById(s);
    if (el) el.style.display = 'none';
  });
  const cel = document.getElementById(id);
  if (cel) cel.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fullscreenBezar(); });
</script>
